[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-flash-mla-moe"
version = "0.1.0.dev0"
description = "Correctness-first DeepSeek MLA and MoE operator study"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allen Feng" }]
dependencies = ["torch>=2.4"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["numpy>=1.26", "pytest>=8", "ruff>=0.9"]
cuda-build = ["ninja>=1.11"]

[project.urls]
Repository = "https://github.com/yfeng445/ds-flashdmla-moe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["cuda: tests that require a built native extension and NVIDIA GPU"]

[tool.ruff]
line-length = 100
target-version = "py310"

name: Reference tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: ruff format --check src tests examples benchmarks setup.py
      - run: ruff check src tests examples benchmarks setup.py
      - run: pytest
      - name: Run tail-shape GEMM validator
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/gemm.py
          --device cpu --dtype float64 --implementation tiled
          --m 37 --n 29 --k 23
          --tile-m 16 --tile-n 8 --tile-k 7
          --warmup 0 --iterations 1
          --output benchmark-results/gemm-tail.json
      - name: Run MLA static-cache decode validator
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/mla.py
          --device cpu --dtype float64
          --implementation absorbed --workload decode_with_static_write
          --batch 1 --sequence-length 8 --model-dim 8
          --n-heads 2 --q-lora-rank 4 --kv-lora-rank 4
          --qk-nope-head-dim 2 --qk-rope-head-dim 2 --v-head-dim 2
          --warmup 0 --iterations 1
          --output benchmark-results/mla-decode.json
      - name: Run skewed expert-compute validator
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/experts.py
          --device cpu --backend reference --dtype float64
          --expert-counts 2,0,5
          --model-dim 5 --hidden-dim 4
          --warmup 0 --iterations 1 --backward
          --output benchmark-results/experts-skewed.json
      - name: Run grouped-router validator
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/router.py
          --device cpu --backend reference --dtype float64
          --tokens 7 --model-dim 5 --experts 8 --topk 3
          --n-groups 4 --topk-groups 2 --hot-expert-bias 0.4
          --warmup 0 --iterations 1 --backward
          --output benchmark-results/router.json
      - name: Run two-rank Gloo validator
        if: matrix.python-version == '3.12'
        env:
          GLOO_SOCKET_IFNAME: lo
        run: >-
          torchrun
          --master-addr=127.0.0.1 --master-port=29572
          --nproc-per-node=2
          benchmarks/expert_parallel.py
          --backend gloo --router-backend reference
          --route-backend reference --expert-backend padded --dtype float64
          --tokens-per-rank 3 --token-skew 1
          --model-dim 4 --hidden-dim 5
          --shared-experts 1
          --experts 4 --topk 1 --hot-expert-bias 100 --capacity-factor 1
          --symmetric-cell-capacity 2
          --warmup 0 --iterations 1 --backward
          --output benchmark-results/gloo-expert-parallel.json
      - name: Validate Gloo report contract
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("benchmark-results/gloo-expert-parallel.json").read_text()
          )
          assert report["schema_version"] == 2
          assert report["configuration"]["shared_experts"] == 1
          assert report["shared_expert_compute"]["effective_hidden_dim"] == 5
          grouped = report["expert_compute"]["native_grouped_tile_model"]
          assert grouped["tile_shape"] == [16, 16, 16]
          assert grouped["active_expert_row_tiles"] == 1
          assert grouped["inactive_tail_row_lanes"] == 9
          numeric = report["expert_compute"]["native_numeric_model"]
          assert numeric["supported"] is False
          assert "shared_expert" in report["stage_latency"]
          assert report["load_balance"]["expert_route_rows"]["maximum"] == 7
          assert report["load_balance"]["rank_receive_route_rows"]["values"] == [7, 0]
          capacity = report["load_balance"]["uniform_capacity_model"]
          assert capacity["analytical_only"] is True
          assert capacity["dropped_route_rows"] == 5
          symmetric = report["symmetric_buffer_model"]
          assert symmetric["tensor_shape_per_rank"] == [2, 2, 2, 2, 2, 4]
          assert symmetric["dropped_route_rows"] == 3
          assert symmetric["analytical_only"] is True
          assert report["overlap_model"]["derived_at_median"][
              "optimistic_pipeline_speedup"
          ] >= 1
          assert report["rank_latency"]["rank_count"] == 2
          assert report["rank_latency"]["rank_max"]["raw_samples_ms"] == report[
              "raw_samples_ms"
          ]
          PY
      - name: Run empty-token-rank Gloo validator
        if: matrix.python-version == '3.12'
        env:
          GLOO_SOCKET_IFNAME: lo
        run: >-
          torchrun
          --master-addr=127.0.0.1 --master-port=29574
          --nproc-per-node=2
          benchmarks/expert_parallel.py
          --backend gloo --route-backend reference --expert-backend loop --dtype float64
          --tokens-per-rank 0 --token-skew 3
          --model-dim 4 --hidden-dim 5
          --experts 2 --topk 1
          --warmup 0 --iterations 1 --backward
          --output benchmark-results/gloo-empty-shard.json

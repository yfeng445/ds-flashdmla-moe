name: CUDA tests

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip install '.[test,cuda-build]'
      - run: DS_FLASH_BUILD_CUDA=1 python -m pip install --no-build-isolation --force-reinstall --no-deps .
      - run: python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name())"
      - run: pytest -ra --strict-markers -W error::UserWarning
      - run: >-
          python benchmarks/gemm.py
          --device cuda --dtype float32 --implementation cuda
          --m 127 --n 95 --k 63
          --tile-m 16 --tile-n 16 --tile-k 16
          --warmup 5 --iterations 20
          --output benchmark-results/cuda-gemm-smoke.json
      - run: >-
          python benchmarks/gemm.py
          --device cuda --dtype float32 --implementation torch
          --m 127 --n 95 --k 63
          --tile-m 16 --tile-n 16 --tile-k 16
          --warmup 5 --iterations 20
          --output benchmark-results/baseline-gemm-torch.json
      - run: >-
          python benchmarks/attention.py
          --device cuda --backend cuda --dtype float32
          --batch 1 --heads 2 --query-length 128 --key-length 128
          --head-dim 64 --value-dim 64 --causal
          --warmup 5 --iterations 20
          --output benchmark-results/cuda-smoke.json
      - run: >-
          python benchmarks/attention.py
          --device cuda --backend sdpa --dtype float32
          --batch 1 --heads 2 --query-length 128 --key-length 128
          --head-dim 64 --value-dim 64 --causal
          --warmup 5 --iterations 20
          --output benchmark-results/baseline-attention-sdpa.json
      - run: >-
          python benchmarks/mla.py
          --device cuda --dtype float32 --implementation cuda
          --workload prefill_attention --batch 1 --sequence-length 128
          --model-dim 128 --n-heads 4 --q-lora-rank 32
          --kv-lora-rank 32 --qk-nope-head-dim 32
          --qk-rope-head-dim 16 --v-head-dim 32
          --warmup 5 --iterations 20
          --output benchmark-results/cuda-mla-prefill-smoke.json
      - run: >-
          python benchmarks/mla.py
          --device cuda --dtype float32 --implementation absorbed
          --workload prefill_attention --batch 1 --sequence-length 128
          --model-dim 128 --n-heads 4 --q-lora-rank 32
          --kv-lora-rank 32 --qk-nope-head-dim 32
          --qk-rope-head-dim 16 --v-head-dim 32
          --warmup 5 --iterations 20
          --output benchmark-results/baseline-mla-prefill-absorbed.json
      - run: >-
          python benchmarks/mla.py
          --device cuda --dtype float32 --implementation cuda
          --workload decode_with_static_write --batch 1 --sequence-length 128
          --model-dim 128 --n-heads 4 --q-lora-rank 32
          --kv-lora-rank 32 --qk-nope-head-dim 32
          --qk-rope-head-dim 16 --v-head-dim 32
          --warmup 5 --iterations 20
          --output benchmark-results/cuda-mla-decode-smoke.json
      - run: >-
          python benchmarks/mla.py
          --device cuda --dtype float32 --implementation absorbed
          --workload decode_with_static_write --batch 1 --sequence-length 128
          --model-dim 128 --n-heads 4 --q-lora-rank 32
          --kv-lora-rank 32 --qk-nope-head-dim 32
          --qk-rope-head-dim 16 --v-head-dim 32
          --warmup 5 --iterations 20
          --output benchmark-results/baseline-mla-decode-absorbed.json
      - run: >-
          python benchmarks/experts.py
          --device cuda --backend cuda --dtype float32
          --expert-counts 17,0,5,31
          --model-dim 64 --hidden-dim 128
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/cuda-experts-smoke.json
      - run: >-
          python benchmarks/experts.py
          --device cuda --backend reference --dtype float32
          --expert-counts 17,0,5,31
          --model-dim 64 --hidden-dim 128
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/baseline-experts-fp32-reference.json
      - run: >-
          python benchmarks/experts.py
          --device cuda --backend cuda --dtype float16
          --expert-counts 17,0,5,31
          --model-dim 33 --hidden-dim 65
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/cuda-experts-wmma-smoke.json
      - run: >-
          python benchmarks/experts.py
          --device cuda --backend reference --dtype float16
          --expert-counts 17,0,5,31
          --model-dim 33 --hidden-dim 65
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/baseline-experts-fp16-reference.json
      - name: Validate native expert execution contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          float_report = json.loads(
              Path("benchmark-results/cuda-experts-smoke.json").read_text()
          )
          half_report = json.loads(
              Path("benchmark-results/cuda-experts-wmma-smoke.json").read_text()
          )
          float_model = float_report["work_estimate"]["native_numeric_model"]
          half_model = half_report["work_estimate"]["native_numeric_model"]
          assert float_model["forward_engine"] == "shared_memory_cuda_cores"
          assert float_model["accumulator_dtype"] == "float32"
          assert half_model["forward_engine"] == "wmma_tensor_cores"
          assert half_model["multiplicand_dtype"] == "float16"
          assert half_model["accumulator_dtype"] == "float32"
          assert half_model["materialized_hidden_dtype"] == "float16"
          assert half_model["minimum_compute_capability"] == "7.0"
          assert half_report["verification"]["output"]["max_tolerance_ratio"] <= 1.0
          assert half_report["verification"]["gradients"]["max_tolerance_ratio"] <= 1.0
          PY
      - run: >-
          python benchmarks/router.py
          --device cuda --backend cuda --dtype float32
          --tokens 256 --model-dim 64 --experts 8 --topk 3
          --n-groups 4 --topk-groups 2 --hot-expert-bias 0.4
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/cuda-router-smoke.json
      - run: >-
          python benchmarks/router.py
          --device cuda --backend reference --dtype float32
          --tokens 256 --model-dim 64 --experts 8 --topk 3
          --n-groups 4 --topk-groups 2 --hot-expert-bias 0.4
          --warmup 5 --iterations 20 --backward
          --output benchmark-results/baseline-router-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-smoke-report
          path: benchmark-results/*.json

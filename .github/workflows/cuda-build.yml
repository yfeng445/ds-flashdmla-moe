name: CUDA build

on:
  push:
    paths:
      - "csrc/**"
      - "src/**"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/cuda-build.yml"
  pull_request:
    paths:
      - "csrc/**"
      - "src/**"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/cuda-build.yml"
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      DS_FLASH_BUILD_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: "8.0"
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install --yes python3 python3-pip python3-venv git
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip install build ninja
      - run: python -c "import torch; assert torch.version.cuda == '12.8', torch.version.cuda"
      - run: python -m build --wheel --no-isolation
      - run: |
          python - <<'PY'
          import glob

          paths = glob.glob("dist/*.whl")
          assert len(paths) == 1, paths
          assert "cp3" in paths[0] and "abi3" not in paths[0], paths[0]
          PY
      - run: python -m pip install --no-deps dist/*.whl
      - run: |
          python - <<'PY'
          import torch
          import ds_flash_mla_moe

          assert ds_flash_mla_moe.native_extension_loaded()
          for operator in (
              "attention_forward",
              "attention_backward",
              "route_pack",
              "route_combine",
              "expert_major_pack",
              "grouped_topk",
              "swiglu_experts",
              "tiled_gemm",
              "mla_absorbed_attention",
              "mla_query_projection",
              "mla_query_lora_projection",
              "mla_cache_projection",
              "mla_cache_projection_write",
              "mla_output_projection",
          ):
              qualified = f"ds_flash_mla_moe::{operator}"
              assert torch._C._dispatch_has_kernel_for_dispatch_key(qualified, "CUDA")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-wheel
          path: dist/*.whl

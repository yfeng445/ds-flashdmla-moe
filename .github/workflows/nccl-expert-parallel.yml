name: NCCL Expert Parallel

on:
  workflow_dispatch:

jobs:
  two-gpu:
    runs-on: [self-hosted, linux, x64, cuda, multi-gpu]
    timeout-minutes: 30
    env:
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      TORCH_NCCL_BLOCKING_WAIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip install '.[test,cuda-build]'
      - run: DS_FLASH_BUILD_CUDA=1 python -m pip install --no-build-isolation --force-reinstall --no-deps .
      - name: Require two NCCL-capable GPUs
        run: |
          python - <<'PY'
          import torch
          import torch.distributed as dist

          assert torch.cuda.is_available(), "CUDA is unavailable"
          assert torch.cuda.device_count() >= 2, torch.cuda.device_count()
          assert dist.is_nccl_available(), "PyTorch was built without NCCL"
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "ds_flash_mla_moe::route_pack", "CUDA"
          )
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "ds_flash_mla_moe::route_combine", "CUDA"
          )
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "ds_flash_mla_moe::swiglu_experts", "CUDA"
          )
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "ds_flash_mla_moe::expert_major_pack", "CUDA"
          )
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "ds_flash_mla_moe::grouped_topk", "CUDA"
          )
          for index in range(2):
              print(index, torch.cuda.get_device_name(index))
          PY
      - name: Verify NCCL forward and backward
        run: >-
          torchrun
          --master-addr=127.0.0.1 --master-port=29573
          --nproc-per-node=2
          benchmarks/expert_parallel.py
          --backend nccl --router-backend cuda --route-backend cuda
          --expert-backend cuda --dtype float32
          --tokens-per-rank 16 --token-skew 3
          --model-dim 32 --hidden-dim 64
          --shared-experts 1
          --experts 4 --topk 2
          --warmup 2 --iterations 5 --backward
          --timeout-seconds 120
          --output benchmark-results/nccl-expert-parallel.json
      - name: Verify NCCL FP16 WMMA experts with reference routing
        run: >-
          torchrun
          --master-addr=127.0.0.1 --master-port=29575
          --nproc-per-node=2
          benchmarks/expert_parallel.py
          --backend nccl --router-backend reference --route-backend reference
          --expert-backend cuda --dtype float16 --pipeline-chunks 3
          --tokens-per-rank 8 --token-skew 1
          --model-dim 33 --hidden-dim 65
          --experts 4 --topk 2
          --warmup 1 --iterations 3 --backward
          --timeout-seconds 120
          --output benchmark-results/nccl-expert-parallel-wmma.json
      - name: Verify chunked NCCL communication-compute pipeline
        run: >-
          torchrun
          --master-addr=127.0.0.1 --master-port=29576
          --nproc-per-node=2
          benchmarks/expert_parallel.py
          --backend nccl --router-backend cuda --route-backend cuda
          --expert-backend cuda --dtype float32 --pipeline-chunks 4
          --tokens-per-rank 16 --token-skew 3
          --model-dim 32 --hidden-dim 64
          --shared-experts 1
          --experts 4 --topk 2
          --warmup 2 --iterations 5 --backward
          --timeout-seconds 120
          --output benchmark-results/nccl-expert-parallel-pipelined.json
      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("benchmark-results/nccl-expert-parallel.json").read_text()
          )
          assert report["distributed"]["backend"] == "nccl"
          assert report["configuration"]["route_backend"] == "cuda"
          assert report["configuration"]["router_backend"] == "cuda"
          assert report["configuration"]["expert_backend"] == "cuda"
          assert report["configuration"]["shared_experts"] == 1
          assert report["shared_expert_compute"]["effective_hidden_dim"] == 64
          grouped = report["expert_compute"]["native_grouped_tile_model"]
          assert grouped["applies_to_backend"] == "cuda"
          assert grouped["tile_shape"] == [16, 16, 16]
          assert 0 < grouped["row_lane_utilization"] <= 1
          assert "shared_expert" in report["stage_latency"]
          assert report["distributed"]["world_size"] == 2
          assert report["verification"]["output"]["max_tolerance_ratio"] <= 1.0
          assert report["verification"]["gradients"]["max_tolerance_ratio"] <= 1.0
          assert report["latency"]["count"] == 5
          assert report["rank_latency"]["rank_count"] == 2
          assert report["rank_latency"]["rank_max"]["raw_samples_ms"] == report[
              "raw_samples_ms"
          ]
          assert report["schema_version"] == 2
          assert report["load_balance"]["expert_route_rows"]["total"] == 70
          assert report["load_balance"]["uniform_capacity_model"][
              "analytical_only"
          ] is True
          assert report["symmetric_buffer_model"]["analytical_only"] is True
          assert report["symmetric_buffer_model"]["dropped_route_rows"] == 0
          assert report["overlap_model"]["derived_at_median"][
              "optimistic_pipeline_speedup"
          ] >= 1

          half_report = json.loads(
              Path("benchmark-results/nccl-expert-parallel-wmma.json").read_text()
          )
          assert half_report["configuration"]["dtype"] == "float16"
          assert half_report["configuration"]["router_backend"] == "reference"
          assert half_report["configuration"]["route_backend"] == "reference"
          assert half_report["configuration"]["expert_backend"] == "cuda"
          assert half_report["configuration"]["pipeline_chunks"] == 3
          numeric = half_report["expert_compute"]["native_numeric_model"]
          assert numeric["forward_engine"] == "wmma_tensor_cores"
          assert numeric["multiplicand_dtype"] == "float16"
          assert numeric["accumulator_dtype"] == "float32"
          assert numeric["materialized_hidden_dtype"] == "float16"
          assert half_report["overlap_model"]["async_pipeline_executed"] is True
          assert half_report["overlap_model"]["hardware_overlap_verified"] is False
          assert half_report["verification"]["output"]["max_tolerance_ratio"] <= 1.0
          assert half_report["verification"]["gradients"]["max_tolerance_ratio"] <= 1.0

          pipeline_report = json.loads(
              Path("benchmark-results/nccl-expert-parallel-pipelined.json").read_text()
          )
          assert pipeline_report["distributed"]["counts_matrix"] == report["distributed"][
              "counts_matrix"
          ]
          assert pipeline_report["configuration"]["pipeline_chunks"] == 4
          assert pipeline_report["overlap_model"]["async_pipeline_executed"] is True
          assert pipeline_report["overlap_model"]["hardware_overlap_verified"] is False
          assert pipeline_report["overlap_model"]["pipeline_chunks"] == 4
          chunked_tiles = pipeline_report["expert_compute"]["native_grouped_tile_model"]
          assert chunked_tiles["chunked_task_counts_are_reported"] is True
          assert chunked_tiles["pipeline_chunks"] == 4
          assert chunked_tiles["chunked_aggregate"]["active_route_rows"] == (
              pipeline_report["work_estimate"]["total_routes"]
          )
          assert chunked_tiles["chunked_aggregate"]["active_expert_row_tiles"] >= (
              chunked_tiles["active_expert_row_tiles"]
          )
          assert (
              chunked_tiles["chunked_aggregate"]["allocated_row_lanes"]
              - chunked_tiles["chunked_aggregate"]["inactive_tail_row_lanes"]
              == pipeline_report["work_estimate"]["total_routes"]
          )
          assert "pipelined_core" in pipeline_report["stage_latency"]
          assert "dispatch" not in pipeline_report["stage_latency"]
          assert pipeline_report["verification"]["output"]["max_tolerance_ratio"] <= 1.0
          assert pipeline_report["verification"]["gradients"]["max_tolerance_ratio"] <= 1.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nccl-expert-parallel-report
          path: benchmark-results/nccl-expert-parallel*.json
